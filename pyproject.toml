[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-gold-strategy-lab"
version = "0.1.0"
description = "Research-only Forex and gold strategy backtesting baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
