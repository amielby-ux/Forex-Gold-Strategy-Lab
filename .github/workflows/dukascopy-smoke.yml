name: Dukascopy live smoke test
on:
  workflow_dispatch:
  push:
    branches: [phase-1-backtesting]
    paths:
      - '.github/workflows/dukascopy-smoke.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e .
      - name: Download and verify one historical Gold hour
        run: python -m strategy_lab.live_smoke
